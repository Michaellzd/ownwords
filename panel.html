<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Draft</title>
  <link rel="icon" href="icons/48.png">
  <link rel="stylesheet" href="src/panel.css">
  <script type="module" src="src/panel.js"></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <a class="brand" href="#" aria-label="X Draft 首页"><span class="brand-mark" aria-hidden="true">xd.</span><span>X Draft</span></a>
      <button id="settings-toggle" class="text-button" aria-expanded="false" aria-controls="settings">设置</button>
    </header>

    <section id="settings" class="settings" aria-labelledby="settings-title" hidden>
      <div class="section-top"><h2 id="settings-title">连接 OpenRouter</h2><span class="small">只需设置一次</span></div>
      <form id="settings-form">
        <label for="api-key">API Key</label>
        <div class="key-field"><input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-or-…" required><button type="button" id="key-toggle" class="text-button" aria-label="显示 API Key">显示</button></div>
        <label for="model-preset">模型</label>
        <select id="model-preset"><option value="anthropic/claude-haiku-5.5">Claude Haiku 5.5</option><option value="openai/gpt-6-luna">GPT-6 Luna</option><option value="custom">自定义模型</option></select>
        <label id="model-label" for="model" hidden>模型 ID</label>
        <input id="model" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="provider/model-name" maxlength="200" aria-describedby="model-help" hidden>
        <p id="model-help" class="small">从 <a href="https://openrouter.ai/models" target="_blank" rel="noreferrer">OpenRouter 模型页</a>复制完整 ID，可随时更换。</p>
        <div class="settings-actions"><button type="submit" class="primary">保存设置</button><button type="button" id="forget-key" class="text-button danger">移除 Key</button></div>
        <p class="privacy small">Key 仅保存在此浏览器本地，未加密。生成时，初稿和上下文会直接发给 OpenRouter 及模型提供方。</p>
      </form>
    </section>

    <div class="intro"><h1>想说的，自然地说出来。</h1><p class="intro-copy">贴上初稿，留住你的语气。中英混写也没关系。</p></div>

    <form id="rewrite-form">
      <section class="draft-section" aria-labelledby="draft-label">
        <div class="section-top"><label id="draft-label" for="draft">你的初稿</label><button type="button" id="clear" class="text-button">清空</button></div>
        <textarea id="draft" rows="7" maxlength="8000" placeholder="I think the hardest part of building something is not coding, is figuring out if people really need it." aria-describedby="draft-hint" required></textarea>
        <div class="field-footer"><span id="draft-hint">英文、中文，或者混着写</span><span id="draft-count">0 / 8,000</span></div>
      </section>

      <fieldset class="styles"><legend>怎么改？</legend><div class="style-options">
        <label><input type="radio" name="style" value="natural" checked><span>自然一点</span></label>
        <label><input type="radio" name="style" value="concise"><span>更简短</span></label>
        <label><input type="radio" name="style" value="grammar"><span>只改语法</span></label>
      </div></fieldset>

      <details id="context-details"><summary>补充上下文<span class="small">可选</span></summary><label class="small context-label" for="context">你在回复什么？粘贴原帖，帮助理解你的意思。</label><textarea id="context" rows="3" maxlength="4000" placeholder="粘贴对方的原话…"></textarea></details>

      <div class="generate-row"><button type="submit" id="generate" class="primary generate"><span id="generate-label">改成自然英文</span></button><button type="button" id="cancel" class="secondary" hidden>取消</button></div>
      <p class="shortcut"><kbd id="shortcut-modifier">⌘</kbd> <kbd>Enter</kbd> 生成</p>
    </form>

    <p id="status" role="status" aria-live="polite" hidden></p>
    <section id="result-section" class="result-section" aria-labelledby="result-label">
      <div class="section-top"><label id="result-label" for="result">你的英文表达</label><button type="button" id="copy" class="text-button" disabled>复制</button></div>
      <div id="empty-result" class="empty-result"><span aria-hidden="true">Aa</span><p>你的意思，更清楚一点。</p><p class="small">生成后的英文会出现在这里。</p></div>
      <textarea id="result" rows="6" aria-label="改写结果，可继续编辑" hidden></textarea>
      <div id="result-meta" class="result-meta" hidden><span>可直接编辑后复制</span><span id="result-count"></span></div>
      <p id="stale-note" class="small" hidden>初稿或改写方式已更改。这里还是上一次的结果。</p>
    </section>
    <footer><a href="https://github.com/Michaellzd/x-draft/blob/main/PRIVACY.md" target="_blank" rel="noreferrer">隐私说明</a><span id="model-status">尚未连接</span></footer>
  </main>
</body>
</html>
